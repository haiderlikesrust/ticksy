map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 16k;

    # Resolve again after a backend/frontend container is replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend http://web:80;
    set $backend http://game:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self'; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location ~ ^/(?:assets|fonts)/ {
        proxy_pass $frontend;
        expires 1h;
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_min_length 512;
        gzip_types text/css application/javascript image/svg+xml;
    }

    location /api/ {
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_buffering off;
        proxy_pass $backend;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location / { proxy_pass $frontend; }
}
